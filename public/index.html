<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F59E0B"><title>TK27 Ogun — Coordinator Data Collection</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="shell">
  <section class="brand">
    <div class="brand-mark">TK27</div>
    <div><h1>Coordinator Data Collection</h1><p>Ogun State</p></div>
  </section>

  <section class="card">
    <div class="notice">Please enter one coordinator at a time. All selected geography is verified against the master list.</div>
    <form id="form" novalidate>
      <label>Position<select id="position" required><option value="">Select position</option>
        <option value="STATE_EXCO">State Exco</option>
        <option value="LGA_COORDINATOR">LGA Coordinator</option>
        <option value="WARD_COORDINATOR">Ward Coordinator</option>
      </select></label>
      <label>Full Name<input id="name" maxlength="120" autocomplete="name" placeholder="Enter full name" required></label>
      <label>Phone Number<input id="phone" inputmode="tel" autocomplete="tel" placeholder="08012345678" required></label>
      <label>Local Government<select id="lga" required><option value="">Loading LGAs…</option></select></label>
      <label>Ward<select id="ward" disabled required><option value="">Select LGA first</option></select></label>
      <label>Polling Unit<select id="pu" disabled required><option value="">Select Ward first</option></select></label>
      <button id="submit" type="submit">Submit Record</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
  </section>
  <footer>TK27 • Ogun State • Coordinator Collection</footer>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
