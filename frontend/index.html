<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TK27 Ogun State Coordinator Collection</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
  <div class="shell">
    <header class="brand">
      <div class="brand-mark">TK</div>
      <div>
        <h1>TK27 Ogun State</h1>
        <p>Coordinator Data Collection Portal</p>
      </div>
    </header>

    <div id="systemStatus" class="status info">Loading system and locations…</div>

    <div class="card">
      <form id="coordinatorForm" novalidate>
        <div class="field">
          <label for="position">Position <span>*</span></label>
          <select id="position" required>
            <option value="">Select position</option>
            <option value="STATE_EXCO">State Exco</option>
            <option value="LGA_COORDINATOR">LGA Coordinator</option>
            <option value="WARD_COORDINATOR">Ward Coordinator</option>
          </select>
          <span class="error" data-error-for="position"></span>
        </div>

        <div class="field">
          <label for="name">Full Name <span>*</span></label>
          <input type="text" id="name" placeholder="Enter full name" required>
          <span class="error" data-error-for="name"></span>
        </div>

        <div class="field">
          <label for="phone">Phone Number <span>*</span></label>
          <input type="tel" id="phone" placeholder="e.g., 08012345678" required>
          <span class="error" data-error-for="phone"></span>
        </div>

        <div class="field">
          <label for="lga">Local Government Area (LGA) <span>*</span></label>
          <select id="lga" required disabled>
            <option value="">Loading LGAs…</option>
          </select>
          <span class="error" data-error-for="lga"></span>
        </div>

        <div class="field">
          <label for="ward">Ward <span>*</span></label>
          <select id="ward" required disabled>
            <option value="">Select LGA first</option>
          </select>
          <span class="error" data-error-for="ward"></span>
        </div>

        <div class="field">
          <label for="pollingUnit">Polling Unit <span>*</span></label>
          <select id="pollingUnit" required disabled>
            <option value="">Select ward first</option>
          </select>
          <span class="error" data-error-for="pollingUnit"></span>
        </div>

        <button type="submit" id="submitBtn" class="btn primary" disabled>
          <span class="spinner" hidden></span>
          <span class="btn-text">Submit Record</span>
        </button>
      </form>
    </div>

    <div id="successCard" class="card success-card" hidden>
      <div class="success-icon">✓</div>
      <h2>Submission Successful</h2>
      <p>Your coordinator record has been successfully registered and verified.</p>
      <div class="reference" id="reference">REC-XXXXXXXXXX</div>
      <div>
        <button type="button" id="addAnother" class="btn secondary">Register Another Record</button>
      </div>
    </div>

    <footer>
      TK27 Ogun State Infrastructure &copy; 2026
    </footer>
  </div>
  <script src="/assets/app.js"></script>
</body>

</html>
