<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f59e0b">
  <title>TK27 Ogun State Coordinator Collection</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="shell">
    <section class="brand">
      <div class="brand-mark">TK27</div>
      <div>
        <h1>OGUN STATE</h1>
        <p>Coordinator Data Collection</p>
      </div>
    </section>

    <section class="card">
      <div id="systemStatus" class="status info" role="status">Loading location data…</div>
      <form id="coordinatorForm" novalidate>
        <div class="field">
          <label for="position">Position <span>*</span></label>
          <select id="position" required>
            <option value="">Select position</option>
            <option value="STATE_EXCO">State Exco</option>
            <option value="LGA_COORDINATOR">LGA Coordinator</option>
            <option value="WARD_COORDINATOR">Ward Coordinator</option>
          </select>
          <small class="error" data-error-for="position"></small>
        </div>

        <div class="field">
          <label for="name">Full Name <span>*</span></label>
          <input id="name" type="text" autocomplete="name" maxlength="120" placeholder="Enter full name" required>
          <small class="error" data-error-for="name"></small>
        </div>

        <div class="field">
          <label for="phone">Phone Number <span>*</span></label>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="08012345678" required>
          <small class="error" data-error-for="phone"></small>
        </div>

        <div class="field">
          <label for="lga">Local Government <span>*</span></label>
          <select id="lga" required disabled><option value="">Loading LGAs…</option></select>
          <small class="error" data-error-for="lga"></small>
        </div>

        <div class="field">
          <label for="ward">Ward <span>*</span></label>
          <select id="ward" required disabled><option value="">Select LGA first</option></select>
          <small class="error" data-error-for="ward"></small>
        </div>

        <div class="field">
          <label for="pollingUnit">Polling Unit <span>*</span></label>
          <select id="pollingUnit" required disabled><option value="">Select ward first</option></select>
          <small class="error" data-error-for="pollingUnit"></small>
        </div>

        <button id="submitBtn" class="btn primary" type="submit" disabled>
          <span class="btn-text">Submit Record</span>
          <span class="spinner" hidden></span>
        </button>
      </form>
    </section>

    <section id="successCard" class="card success-card" hidden>
      <div class="success-icon">✓</div>
      <h2>Record submitted</h2>
      <p>Your record has been received successfully.</p>
      <div class="reference" id="reference"></div>
      <button id="addAnother" class="btn secondary">Add Another Record</button>
    </section>

    <footer>TK27 • Ogun State Coordinator Data Collection</footer>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
